services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: lingora
      POSTGRES_PASSWORD: lingora_local
      POSTGRES_DB: lingora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingora -d lingora"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  db-test:
    image: postgres:18.6
    profiles: [test]
    environment:
      POSTGRES_USER: lingora
      POSTGRES_PASSWORD: lingora_test_local
      POSTGRES_DB: lingora_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingora -d lingora_test"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
