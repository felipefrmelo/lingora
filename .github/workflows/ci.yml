name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: lingora
          POSTGRES_PASSWORD: lingora_test_local
          POSTGRES_DB: lingora_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lingora -d lingora_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://lingora:lingora_test_local@localhost:5433/lingora_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked dependencies
        run: |
          uv sync --project apps/api --locked
          pnpm install --frozen-lockfile
      - name: Lint, type checks, unit tests, and build
        run: make lint typecheck test build
      - name: PostgreSQL constraints and migration round trip
        run: uv run --project apps/api pytest apps/api/tests/integration
      - name: Generated API contract is current
        run: |
          make api-generate
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - name: Install test browser
        run: pnpm --filter @lingora/web exec playwright install --with-deps chromium
      - name: Browser tests against the real backend
        run: make test-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.7"
      - run: uv sync --project apps/api --locked
      - run: pnpm install --frozen-lockfile
      - run: make audit
